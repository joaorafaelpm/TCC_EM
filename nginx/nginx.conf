server {
    listen 80;

    location / {
        proxy_pass http://pendezzapizza-api:8080;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host tcc-em.vercel.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_redirect off;
    }
}