stages:
  - build
  - test

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

services:
  - name: mysql:8.3.0
    alias: test-database
    variables:
      MYSQL_ROOT_PASSWORD: $TEST_DATABASE_PASSWORD
      MYSQL_USER: $TEST_DATABASE_USERNAME
      MYSQL_PASSWORD: $TEST_DATABASE_PASSWORD
      MYSQL_DATABASE: $TEST_DATABASE_NAME

  - name: redis:8.4.0-alpine
    alias: test-redis

build-api:
  stage: build
  image: eclipse-temurin:21-jdk
  script:
    - chmod +x ./pendezzapizza-api/mvnw
    - ./pendezzapizza-api/mvnw -f ./pendezzapizza-api/pom.xml package -DskipTests
  artifacts:
    paths:
      - pendezzapizza-api/target/*.jar
    expire_in: 1 hour

e2e-tests:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  dependencies:
    - build-api
  variables:
    # Variáveis equivalentes do GitLab para os scripts
    BUILD_NUMBER: $CI_PIPELINE_IID
    BRANCH_NAME: $CI_COMMIT_REF_NAME
  before_script:
    - |
      cat > ./pendezzapizza-api/.env.test << EOF
      API_HOST=$API_HOST
      API_PORT=$API_PORT
      TEST_DATABASE_USERNAME=$TEST_DATABASE_USERNAME
      TEST_DATABASE_PASSWORD=$TEST_DATABASE_PASSWORD
      TEST_DATABASE_NAME=$TEST_DATABASE_NAME
      TEST_DATABASE_PORT=$TEST_DATABASE_PORT
      JWT_KEYSTORE_LOCATION=$JWT_KEYSTORE_LOCATION
      JWT_KEYSTORE_PASSWORD=$JWT_KEYSTORE_PASSWORD
      JWT_KEYSTORE_KEYPAIR_ALIAS=$JWT_KEYSTORE_KEYPAIR_ALIAS
      RECIPIENT_EMAIL=$RECIPIENT_EMAIL
      SENDER_EMAIL=$SENDER_EMAIL
      DOC_CLIENT_ID=$DOC_CLIENT_ID
      DOC_CLIENT_SECRET=$DOC_CLIENT_SECRET
      EOF
    - |
      cat > ./tests/.env << EOF
      ACCESS_TOKEN_URL=$ACCESS_TOKEN_URL
      API_URL=$API_URL
      REDIRECT_URL=$REDIRECT_URL
      CODE_VERIFIER=$CODE_VERIFIER
      CLIENT_ID=$CLIENT_ID
      CLIENT_SECRET=$CLIENT_SECRET
      CLIENT_USERNAME=$CLIENT_USERNAME
      CLIENT_PASSWORD=$CLIENT_PASSWORD
      RESTAURANT_OWNER_USERNAME=$RESTAURANT_OWNER_USERNAME
      RESTAURANT_OWNER_PASSWORD=$RESTAURANT_OWNER_PASSWORD
      SCOPES=$SCOPES
      EOF
    - docker build -t pendezzapizza-api -f ./pendezzapizza-api/Dockerfile.test ./pendezzapizza-api
    - cd tests && npm ci
    - npm run infra:up
    - npm run infra:wait
  script:
    - cd tests && npm run triggerAllTests
  after_script:
    - cd tests
    - |
      if ls cypress/reports/json/*.json 2>/dev/null; then
        npm run report:merge && npm run report:generate
      else
        echo "Nenhum relatório encontrado, pulando merge."
      fi
    - npm run infra:down
    # Notificação Slack
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        STATUS_EMOJI="✅"
        STATUS_TEXT="Passou"
        STATUS_COLOR="#36a64f"
      else
        STATUS_EMOJI="❌"
        STATUS_TEXT="Falhou"
        STATUS_COLOR="#e01e5a"
      fi
      curl -X POST "$SLACK_WEBHOOK_URL" \
        -H 'Content-type: application/json' \
        --data "{
          \"attachments\": [{
            \"color\": \"$STATUS_COLOR\",
            \"blocks\": [
              {
                \"type\": \"header\",
                \"text\": {\"type\": \"plain_text\", \"text\": \"$STATUS_EMOJI E2E Tests — Pendezza Pizza\"}
              },
              {
                \"type\": \"section\",
                \"fields\": [
                  {\"type\": \"mrkdwn\", \"text\": \"*Status:*\n$STATUS_TEXT\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*Branch:*\n\`$CI_COMMIT_REF_NAME\`\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*Run:*\n#$CI_PIPELINE_IID\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*Commit:*\n$CI_COMMIT_MESSAGE\"}
                ]
              },
              {
                \"type\": \"actions\",
                \"elements\": [
                  {
                    \"type\": \"button\",
                    \"text\": {\"type\": \"plain_text\", \"text\": \"🔍 Ver no Cypress Cloud\"},
                    \"url\": \"https://cloud.cypress.io/projects/$CYPRESS_PROJECT_ID/runs\"
                  },
                  {
                    \"type\": \"button\",
                    \"text\": {\"type\": \"plain_text\", \"text\": \"📋 Ver no GitLab Pipeline\"},
                    \"url\": \"$CI_PIPELINE_URL\"
                  }
                ]
              }
            ]
          }]
        }"
  artifacts:
    when: always
    paths:
      - tests/cypress/reports/html/
      - tests/cypress/screenshots/
      - tests/cypress/videos/
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'