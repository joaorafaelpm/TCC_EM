server.port=${API_SERVER_PORT:8080}
spring.flyway.locations=classpath:db/migration,classpath:db/migration-test

spring.datasource.url=jdbc:mysql://test-database/${TEST_DATABASE_NAME}?createDatabaseIfNotExists=true&serverTimeZone=UTC
spring.datasource.username=${TEST_DATABASE_USERNAME}
spring.datasource.password=${TEST_DATABASE_PASSWORD}

pendezzapizza.security.config.url=http://test-api:${TEST_API_PORT:8080}/oauth2/jwks
pendezzapizza.security.config.url-issuer=http://localhost:${TEST_API_PORT:8080}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:${TEST_API_PORT:8080}/oauth2/jwks

springdoc.oAuthFlow.authorizationUrl=http://localhost:${TEST_API_PORT:8080}/oauth2/authorize
springdoc.oAuthFlow.tokenUrl=http://localhost:${TEST_API_PORT:8080}/oauth2/token